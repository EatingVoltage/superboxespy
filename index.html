<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>superboxes</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='9' width='24' height='18' rx='2' fill='%23f2b33d'/%3E%3Cpath d='M4 13h24M10 9v4M16 9v4M22 9v4' stroke='%2314161a' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">superboxes<span>.py</span></div>
    <button id="gen" class="gen-btn" type="button" aria-haspopup="dialog" aria-label="Box type"></button>
    <input id="name" class="name" type="text" spellcheck="false" aria-label="Box name" placeholder="box name">
    <span id="home" class="home" hidden></span>
    <div class="spacer"></div>
    <button id="btn-file" type="button" aria-haspopup="menu" aria-expanded="false"
            title="New, open, save as, share, the exports, recent boxes and the folder">File ▾</button>
    <button id="btn-save" type="button" class="primary-soft" title="Save the box (Ctrl+S)">Save</button>
    <button id="btn-open-lbrn" type="button" class="primary" title="Write the LightBurn project (a page per sheet) and open it in LightBurn">Open in LightBurn</button>
  </header>

  <main>
    <aside id="side" class="side">
      <!-- the material as one line once it's measured, the box, the mark and notes, then Advanced (closed) -->
      <section class="group material" id="material"></section>
      <div id="params"></div>
      <section class="group" id="output"></section>
      <div id="advanced"></div>
    </aside>

    <section class="stage">
      <div class="panes">
        <div class="pane" data-pane="box">
          <div id="split" class="split">
            <!-- while one half fills the view, a strip on the hidden half's edge brings it back -->
            <button id="show-2d" class="restore restore-2d" type="button" aria-label="Bring the 2D back"
                    title="Bring the 2D back (double-click the 3D to fill the view with it again)">
              <svg viewBox="0 0 10 16" width="10" height="16" aria-hidden="true"><path d="M2 2l6 6-6 6"/></svg><span>2D</span>
            </button>
            <div class="half half-sheets">
              <!-- the tabs, then the toolbar of what's shown, the drawing, and under it the selection's bar -->
              <nav id="board-tabs" class="board-tabs" role="tablist" aria-label="Stamp case boards" hidden></nav>
              <nav id="face-tabs" class="board-tabs" role="tablist" aria-label="Box faces" hidden></nav>
              <div id="sheet-tools" class="toolbar" role="toolbar" aria-label="Sheets"></div>
              <div id="board-tools" class="toolbar" role="toolbar" aria-label="Board" hidden></div>
              <div id="face-tools" class="toolbar" role="toolbar" aria-label="Face" hidden></div>
              <div id="board" class="board" hidden></div>
              <div id="face" class="board" hidden></div>
              <div id="sheets" class="sheets" title="Double-click empty space to fill the view with the sheets"></div>
              <div id="board-bar" class="inspector board-bar" hidden></div>
              <div id="face-bar" class="inspector board-bar" hidden></div>
              <div id="inspector" class="inspector" hidden></div>
            </div>
            <div id="divider" class="divider" role="separator" aria-orientation="vertical" aria-label="Sheets | 3D"
                 tabindex="0" title="Drag to share the space · arrow keys move it · double-click a view to fill the space with it"></div>
            <div class="half half-3d">
              <div id="view3d-tools" class="toolbar" role="toolbar" aria-label="3D" hidden></div>
              <div id="view3d" class="view3d" title="Double-click to fill the view with the 3D"></div>
              <div id="view3d-controls" class="view3d-controls"></div>
            </div>
            <button id="show-3d" class="restore restore-3d" type="button" aria-label="Bring the 3D back"
                    title="Bring the 3D back (double-click empty space on the sheets to fill the view with them again)">
              <svg viewBox="0 0 10 16" width="10" height="16" aria-hidden="true"><path d="M8 2 2 8l6 6"/></svg><span>3D</span>
            </button>
          </div>
        </div>
        <div class="pane" data-pane="calib" hidden>
          <div class="toolbar calib-head">
            <button id="calib-back" type="button" title="Back to the sheets and the 3D (Esc)">← Back to the box</button>
          </div>
          <div id="calib" class="calib"></div>
        </div>
      </div>
      <footer class="statusbar">
        <span id="status" class="status">Starting…</span>
        <span id="messages" class="messages"></span>
        <span class="legal">© 2026 eatingVoltage · boxes.py © Florian Festi and contributors ·
          free software under the <a href="https://www.gnu.org/licenses/gpl-3.0.html" target="_blank" rel="noopener">GPL-3.0-or-later</a>,
          no warranty · <a href="https://github.com/EatingVoltage/superboxespy" target="_blank" rel="noopener">source</a></span>
      </footer>
    </section>
  </main>

  <div id="menu" class="menu" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
